# Replication target: Colliard, Foucault & Lovo. Two Q-learning MMs.
# Sweep alpha in {0.1, 0.3, 0.5} with experiments/sweep.py.
run_name: cfl_2mm
seed: 0
n_episodes: 20000
n_tape_episodes: 5
log_every: 1000
market:
  n_mm: 2
  alpha: 0.3
  sigma_L: 6.0
  tick: 1.0
  max_half_spread: 15
  horizon: 100
  redraw_v_each_period: true
agents:
  - {type: q, params: {learning_rate: 0.15, discount: 0.95, exploration_decay: 0.000002}}
  - {type: q, params: {learning_rate: 0.15, discount: 0.95, exploration_decay: 0.000002}}
impulse: {enabled: true, n_episodes: 500, t_shock: 50, pre: 5, post: 15}
